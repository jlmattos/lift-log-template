name: Nightly backup

# Dumps the Supabase database to backups/latest.json and commits it.
# Git history keeps every night's snapshot forever — restore is just
# checking out any past version of the file.
#
# Requires two repository secrets (Settings → Secrets and variables →
# Actions): SUPABASE_URL and SUPABASE_SECRET_KEY.

on:
  schedule:
    - cron: "0 9 * * *" # ~5am ET daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Dump database
        run: node scripts/backup.mjs --latest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Commit snapshot
        run: |
          git config user.name "backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/latest.json
          git diff --cached --quiet || git commit -m "Nightly backup"
          git push
